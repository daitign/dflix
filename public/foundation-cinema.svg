  <path d="m782 482 141-198 100 248" fill="none" stroke="#dfb76b" stroke-opacity=".26" stroke-width="2"/>
  <path d="M190 82h142" stroke="#e2bd76" stroke-opacity=".46"/>
  <text x="190" y="122" fill="#f8f8f6" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5">DAITIGN STUDY 01</text>
  <text x="190" y="150" fill="#929ba7" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">ORIGINAL SYSTEM ARTWORK</text>
