<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Abstract gold light in a dark cinematic landscape</title>
  <desc id="desc">Original DAITIGN Stream design system artwork made from soft gradients and geometric forms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="0.52" stop-color="#090b0e"/>
      <stop offset="1" stop-color="#171109"/>
    </linearGradient>
    <radialGradient id="halo" cx="72%" cy="29%" r="55%">
      <stop offset="0" stop-color="#e7c27b" stop-opacity=".7"/>
      <stop offset=".27" stop-color="#b88131" stop-opacity=".18"/>
      <stop offset="1" stop-color="#090b0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1=".15" y1=".2" x2=".8" y2="1">
      <stop stop-color="#323943"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#halo)"/>
  <circle cx="917" cy="207" r="69" fill="#e2bd76" opacity=".92" filter="url(#blur)"/>
  <circle cx="917" cy="207" r="48" fill="#f2d99f"/>
